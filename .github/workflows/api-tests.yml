
name: ReqRes API Automation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://reqres.in
      API_KEY: ${{ secrets.REQRES_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Cucumber API tests
        run: npm test

      - name: Upload HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-api-test-report
          path: reports/cucumber-report.html
          if-no-files-found: warn
          retention-days: 14

  deploy-report:
    name: Publish HTML Report
    needs: api-tests
    if: always() && github.event_name != 'pull_request' && contains(fromJSON('["main","master"]'), github.ref_name)
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download HTML report
        uses: actions/download-artifact@v4
        with:
          name: cucumber-api-test-report
          path: public

      - name: Prepare report website
        run: |
          if [ ! -f public/cucumber-report.html ]; then
            echo "HTML report was not generated."
            exit 1
          fi
          cp public/cucumber-report.html public/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v4
